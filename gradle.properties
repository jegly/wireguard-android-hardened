wireguardVersionCode=10
wireguardVersionName=1.0.10
wireguardPackageName=com.wireguard.android
# Installed app ID. Must differ from the official app (com.wireguard.android),
# or Google Play offers its updates for this app. wireguardPackageName stays
# the code namespace.
wireguardApplicationId=com.jegly.hardenedwireguard

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
